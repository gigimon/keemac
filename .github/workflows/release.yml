name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check the tag is vX.Y.Z
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags look like v1.2.3, got '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: version
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Run test suite
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: swift test

  ui-tests:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Allow UI automation without a prompt
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Verify scripts are executable
        run: chmod +x scripts/build_app.sh scripts/run_ui_tests.sh

      - name: Run UI tests
        run: scripts/run_ui_tests.sh

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeeMac-ui-test-results
          path: .build/UITests.xcresult
          retention-days: 14

  publish-release:
    needs: [version, unit-tests, ui-tests]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Verify scripts are executable
        run: chmod +x scripts/build_app.sh scripts/make_release_archive.sh

      - name: Install signing certificate and provisioning profile
        env:
          DEVELOPER_ID_P12: ${{ secrets.KEEMAC_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.KEEMAC_DEVELOPER_ID_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.KEEMAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for variable in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD PROVISIONING_PROFILE; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Secret KEEMAC_$variable is not set"
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/keemac-release.provisionprofile"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install notary API key
        env:
          NOTARY_KEY: ${{ secrets.KEEMAC_NOTARY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NOTARY_KEY" ]]; then
            echo "::error::Secret KEEMAC_NOTARY_KEY is not set"
            exit 1
          fi
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "KEEMAC_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, notarize and pack release archive
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          KEEMAC_NOTARY_KEY_ID: ${{ secrets.KEEMAC_NOTARY_KEY_ID }}
          KEEMAC_NOTARY_ISSUER: ${{ secrets.KEEMAC_NOTARY_ISSUER }}
        run: scripts/make_release_archive.sh --notarize

      - name: Check the archive is a signed KeeMac
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/check"
          mkdir -p "$CHECK_DIR"
          ditto -x -k .build/release/*.zip "$CHECK_DIR"
          APP="$CHECK_DIR/KeeMac.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")"
          if [[ "$BUNDLE_ID" != "tech.keemac.app" ]]; then
            echo "::error::Bundle ID is $BUNDLE_ID, expected tech.keemac.app"
            exit 1
          fi
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$APP"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ needs.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ needs.version.outputs.tag }}" \
              --title "KeeMac ${{ needs.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            .build/release/*.zip \
            .build/release/*.sha256 \
            --clobber

      - name: Remove signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/keemac-release.provisionprofile"

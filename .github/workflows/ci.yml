name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run test suite
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: swift test

  package:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scripts are executable
        run: chmod +x scripts/build_app.sh

      - name: Build KeeMac Dev archive
        run: |
          set -euo pipefail
          scripts/build_app.sh --clean
          source scripts/resolve_version.sh
          mkdir -p .build/release
          ARCHIVE=".build/release/KeeMac-Dev-$APP_VERSION-macOS.zip"
          ditto -c -k --keepParent ".build/dist/KeeMac Dev.app" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeeMac-Dev-ci-build
          path: |
            .build/release/*.zip
            .build/release/*.sha256
